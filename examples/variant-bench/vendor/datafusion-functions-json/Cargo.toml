# VENDORED from https://github.com/datafusion-contrib/datafusion-functions-json (v0.55.6, Apache-2.0).
# The only change: `datafusion` points at the apache/datafusion branch-56 git branch (upstream
# targets DataFusion 55, which cannot be mixed with the branch-56 types datafusion-variant needs).
# Drop this copy once upstream releases a DataFusion 56 version.
[package]
name = "datafusion-functions-json"
version = "0.55.6"
edition = "2021"
description = "JSON functions for DataFusion"
readme = "README.md"
license = "Apache-2.0"
keywords = ["datafusion", "JSON", "SQL"]
categories = ["database-implementations", "parsing"]
repository = "https://github.com/datafusion-contrib/datafusion-functions-json/"
rust-version = "1.94.0"

[dependencies]
datafusion = { git = "https://github.com/apache/datafusion.git", branch = "branch-56", default-features = false, features = [
    "sql",
] }
jiter = "0.17.0"
log = "0.4"
paste = "1"
serde_json = "1"
